<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anvaya by Raj Thakkar</title>
  <style>
    body { background: #022c22; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; color: #ecfdf5; margin: 0; }
    .card { background: #064e3b; padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: inline-block; width: 100%; max-width: 450px; box-sizing: border-box; border: 1px solid #047857; }
    input { padding: 14px; font-size: 16px; border-radius: 12px; border: 1px solid #059669; margin: 10px 0; width: 90%; box-sizing: border-box; background: #022c22; color: #ecfdf5; outline: none; }
    input:focus { border-color: #34d399; }
    button { padding: 14px; font-size: 18px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; width: 90%; margin: 10px 0; background: #059669; color: white; transition: background 0.2s; }
    button:hover { background: #047857; }
    .link-btn { background: #059669; text-decoration: none; display: inline-block; color: white; border-radius: 12px; padding: 14px; font-weight: bold; width: 90%; box-sizing: border-box; margin-bottom: 10px; }
    
    .live-orb { width: 130px; height: 130px; background: linear-gradient(135deg, #059669, #34d399, #10b981); border-radius: 50%; margin: 25px auto; display: flex; align-items: center; justify-content: center; font-size: 45px; color: white; cursor: pointer; border: none; box-shadow: 0 0 30px rgba(52, 211, 153, 0.4); transition: transform 0.2s; }
    .live-orb.active { animation: livePulse 1.5s infinite; background: #047857; box-shadow: 0 0 40px rgba(52, 211, 153, 0.9); }
    @keyframes livePulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
      70% { transform: scale(1.12); box-shadow: 0 0 0 25px rgba(52, 211, 153, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }

    #chat-box { height: 210px; border: 1px solid #047857; border-radius: 14px; overflow-y: auto; margin-bottom: 12px; padding: 12px; text-align: left; background: #022c22; font-size: 14px; color: #a7f3d0; }
    
    .branding-top { font-size: 18px; font-weight: 700; color: #34d399; margin-bottom: 15px; letter-spacing: 1px; text-transform: uppercase; }
    .branding-bottom { font-size: 15px; font-weight: 700; color: #34d399; margin-top: 20px; letter-spacing: 1px; border-top: 2px solid #047857; padding-top: 15px; text-transform: uppercase; text-shadow: 0 0 15px rgba(52, 211, 153, 0.4); }
    #status { font-weight: bold; color: #34d399; margin: 10px 0; font-size: 14px; }
  </style>
</head>
<body>

<div class="card">
  <div class="branding-top">Anvaya by Raj Thakkar</div>
  
  <div id="setup-screen">
    <p style="font-size: 14px; color: #a7f3d0;">Enter your Google API key to establish connection:</p>
    <a href="https://aistudio.google.com/app/apikey" target="_blank" class="link-btn">1. Get Free Key from Google</a>
    <input type="password" id="apiKeyInput" placeholder="Paste your API key here">
    <button onclick="saveKey()">2. Launch Anvaya Live</button>
  </div>

  <div id="app-screen" style="display:none;">
    <div id="chat-box"><div><b>System:</b> Ready. Tap the orb and speak.</div></div>
    <div id="status">Tap orb to start</div>
    <button id="orbBtn" class="live-orb" onclick="toggleLiveSession()">🎙️</button>
  </div>

  <div class="branding-bottom">Powered by Raj Thakkar</div>
</div>

<script>
  let ws = null;
  let audioContext = null;
  let mediaStream = null;
  let scriptProcessor = null;
  let isConnected = false;
  let audioQueue = [];
  let isPlaying = false;
  let masterGain = null;

  function saveKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if(!key) { alert("Please paste your API key!"); return; }
    localStorage.setItem('anvaya_key', key);
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
  }

  window.onload = function() {
    if(localStorage.getItem('anvaya_key')) {
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
    }
  }

  async function toggleLiveSession() {
    if (isConnected) {
      stopLiveSession();
    } else {
      await startLiveSession();
    }
  }

  async function startLiveSession() {
    const apiKey = localStorage.getItem('anvaya_key');
    if (!apiKey) return;

    document.getElementById('status').innerText = "Connecting...";

    try {
      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }

      mediaStream = await navigator.mediaDevices.getUserMedia({ 
        audio: { channelCount: 1, sampleRate: 16000, echoCancellation: true, noiseSuppression: true } 
      });
    } catch (err) {
      document.getElementById('status').innerText = "Mic permission denied!";
      return;
    }

    const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`;
    ws = new WebSocket(url);

    ws.onopen = () => {
      isConnected = true;
      document.getElementById('orbBtn').classList.add('active');
      document.getElementById('status').innerText = "Anvaya Live Active. Speak freely.";
      
      const setupMessage = {
        setup: {
          model: "models/gemini-2.0-flash-exp",
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
          },
          systemInstruction: {
            parts: [{ text: "You are Anvaya, an instant, fluid conversational partner built by Raj Thakkar. Reply directly, naturally, and match the user's language instantly." }]
          }
        }
      };
      ws.send(JSON.stringify(setupMessage));
      startAudioProcessing();
    };

    ws.onmessage = async (event) => {
      try {
        const text = event.data instanceof Blob ? await event.data.text() : event.data;
        const response = JSON.parse(text);
        
        if (response.serverContent && response.serverContent.modelTurn) {
          const parts = response.serverContent.modelTurn.parts;
          for (const part of parts) {
            if (part.text) {
              const box = document.getElementById('chat-box');
              box.innerHTML += `<div style="margin: 4px 0;"><b style="color:#34d399;">Anvaya:</b> ${part.text}</div>`;
              box.scrollTop = box.scrollHeight;
            }
            if (part.inlineData && part.inlineData.data) {
              enqueueAudio(part.inlineData.data);
            }
          }
        }
      } catch (e) {
        console.error("Message parse error", e);
      }
    };

    ws.onerror = (e) => {
      console.error("WS Error", e);
      document.getElementById('status').innerText = "Connection error.";
      stopLiveSession();
    };

    ws.onclose = () => {
      stopLiveSession();
    };
  }

  function startAudioProcessing() {
    const source = audioContext.createMediaStreamSource(mediaStream);
    scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);

    masterGain = audioContext.createGain();
    masterGain.gain.value = 1.0; // Volume output control

    scriptProcessor.onaudioprocess = (e) => {
      if (!isConnected || !ws || ws.readyState !== WebSocket.OPEN) return;
      
      const inputData = e.inputBuffer.getChannelData(0);
      const pcm16 = new Int16Array(inputData.length);
      for (let i = 0; i < inputData.length; i++) {
        let s = Math.max(-1, Math.min(1, inputData[i]));
        pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }

      const base64Data = btoa(String.fromCharCode.apply(null, new Uint8Array(pcm16.buffer)));
      ws.send(JSON.stringify({
        realtimeInput: {
          mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: base64Data }]
        }
      }));
    };

    // CRITICAL: Connecting processor to destination keeps the browser audio clock running so mic data flows continuously
    source.connect(scriptProcessor);
    scriptProcessor.connect(masterGain);
    masterGain.connect(audioContext.destination);
  }

  function enqueueAudio(base64Data) {
    const binary = atob(base64Data);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
    
    const pcm16 = new Int16Array(bytes.buffer);
    const float32 = new Float32Array(pcm16.length);
    for (let i = 0; i < pcm16.length; i++) { float32[i] = pcm16[i] / 32768.0; }

    audioQueue.push(float32);
    if (!isPlaying) { playQueue(); }
  }

  function playQueue() {
    if (audioQueue.length === 0) {
      isPlaying = false;
      return;
    }
    isPlaying = true;
    const float32 = audioQueue.shift();

    const buffer = audioContext.createBuffer(1, float32.length, 24000);
    buffer.getChannelData(0).set(float32);

    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(audioContext.destination);
    source.onended = () => playQueue();
    source.start();
  }

  function stopLiveSession() {
    isConnected = false;
    isPlaying = false;
    audioQueue = [];

    if (scriptProcessor) { scriptProcessor.disconnect(); scriptProcessor = null; }
    if (masterGain) { masterGain.disconnect(); masterGain = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    if (ws) { ws.close(); ws = null; }
    if (audioContext && audioContext.state !== 'closed') { audioContext.close(); audioContext = null; }

    const orb = document.getElementById('orbBtn');
    if (orb) orb.classList.remove('active');
    const status = document.getElementById('status');
    if (status) status.innerText = "Tap orb to start";
  }
</script>

</body>
</html>
