<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini 3.6 Flash Live Replica by Raj Thakkar</title>
  <style>
    body { background: #0b0f19; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; color: #f8fafc; margin: 0; }
    .card { background: #131b2e; padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: inline-block; width: 100%; max-width: 450px; box-sizing: border-box; border: 1px solid #1e293b; }
    input { padding: 14px; font-size: 16px; border-radius: 12px; border: 1px solid #334155; margin: 10px 0; width: 90%; box-sizing: border-box; background: #0b0f19; color: white; outline: none; }
    input:focus { border-color: #3b82f6; }
    button { padding: 14px; font-size: 18px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; width: 90%; margin: 10px 0; background: #3b82f6; color: white; transition: background 0.2s; }
    button:hover { background: #2563eb; }
    .link-btn { background: #2563eb; text-decoration: none; display: inline-block; color: white; border-radius: 12px; padding: 14px; font-weight: bold; width: 90%; box-sizing: border-box; margin-bottom: 10px; }
    
    /* True Gemini Live Pulsing Orb */
    .live-orb { width: 120px; height: 120px; background: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899); border-radius: 50%; margin: 25px auto; display: flex; align-items: center; justify-content: center; font-size: 45px; color: white; cursor: pointer; border: none; box-shadow: 0 0 30px rgba(59, 130, 246, 0.4); transition: transform 0.2s; }
    .live-orb.listening { animation: livePulse 1.5s infinite; background: #ef4444; box-shadow: 0 0 35px rgba(239, 68, 68, 0.8); }
    @keyframes livePulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.12); box-shadow: 0 0 0 25px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    #chat-box { height: 240px; border: 1px solid #1e293b; border-radius: 14px; overflow-y: auto; margin-bottom: 15px; padding: 12px; text-align: left; background: #0b0f19; font-size: 14px; color: #cbd5e1; }
    
    /* Prominent Large Branding for Raj Thakkar */
    .branding { font-size: 24px; font-weight: 800; color: #38bdf8; margin-top: 25px; letter-spacing: 1.5px; border-top: 2px solid #1e293b; padding-top: 15px; text-transform: uppercase; text-shadow: 0 0 20px rgba(56, 189, 248, 0.5); }
    
    #status { font-weight: bold; color: #60a5fa; margin: 12px 0; font-size: 15px; }
  </style>
</head>
<body>

<div class="card">
  <h2>✨ Gemini 3.6 Flash Core ✨</h2>
  
  <div id="setup-screen">
    <p style="font-size: 14px; color: #94a3b8;">Enter your email and paste your Google API key:</p>
    <input type="email" id="parentEmail" placeholder="Your Email">
    <a href="https://aistudio.google.com/app/apikey" target="_blank" class="link-btn">1. Get Free Key from Google</a>
    <input type="password" id="apiKeyInput" placeholder="Paste your API key here">
    <button onclick="saveKey()">2. Initialize Live Stream</button>
  </div>

  <div id="app-screen" style="display:none;">
    <div id="chat-box"><div><b>System:</b> Gemini 3.6 Flash session initialized. Tap the glowing orb to speak freely.</div></div>
    <div id="status">Tap orb to speak</div>
    <button id="orbBtn" class="live-orb" onclick="toggleListening()">🎙️</button>
  </div>

  <div class="branding">Raj Thakkar</div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTEVn6j5vqgsfWA2y4peYib5deA__cQLI2Z5KlXPeKwibwcJOz8vbLJYYkHbzcejU/exec"; 
  let recognition;
  let isListening = false;

  function saveKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    const email = document.getElementById('parentEmail').value.trim();
    
    if(!key) {
      alert("Please paste your API key first!");
      return;
    }

    localStorage.setItem('app_key', key);
    if(email) localStorage.setItem('parent_email', email);

    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
  }

  window.onload = function() {
    if(localStorage.getItem('app_key')) {
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
    }
    initSpeechRecognition();
  }

  function initSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return;

    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onresult = function(event) {
      const transcript = event.results[0][0].transcript;
      document.getElementById('status').innerText = "Hearing: " + transcript;
      if (event.results[0].isFinal) {
        sendToBackend(transcript);
      }
    };

    recognition.onerror = function() {
      stopOrb();
      document.getElementById('status').innerText = "Tap orb to speak";
    };

    recognition.onend = function() {
      stopOrb();
    };
  }

  function toggleListening() {
    if (!recognition) {
      alert("Speech recognition is not supported in this browser. Please use Google Chrome.");
      return;
    }

    if (isListening) {
      recognition.stop();
      stopOrb();
    } else {
      try {
        recognition.start();
        startOrb();
      } catch (e) {
        recognition.stop();
        stopOrb();
      }
    }
  }

  function startOrb() {
    isListening = true;
    document.getElementById('orbBtn').classList.add('listening');
    document.getElementById('status').innerText = "Listening actively... Speak now!";
  }

  function stopOrb() {
    isListening = false;
    document.getElementById('orbBtn').classList.remove('listening');
    if (!document.getElementById('status').innerText.includes("Thinking")) {
      document.getElementById('status').innerText = "Tap orb to speak";
    }
  }

  async function sendToBackend(text) {
    const chatBox = document.getElementById('chat-box');
    chatBox.innerHTML += `<div style="margin: 8px 0;"><b style="color: #60a5fa;">You:</b> ${text}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
    document.getElementById('status').innerText = "Gemini 3.6 Flash is thinking...";

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          apiKey: localStorage.getItem('app_key'),
          message: text
        })
      });

      const data = await response.json();
      
      let reply = "";
      if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
        reply = data.candidates[0].content.parts[0].text;
      } else if (data.error) {
        reply = "API Error: " + (data.error.message || JSON.stringify(data.error));
      } else {
        reply = JSON.stringify(data);
      }
      
      chatBox.innerHTML += `<div style="margin: 8px 0;"><b style="color: #34d399;">Gemini:</b> ${reply}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
      document.getElementById('status').innerText = "Tap orb to speak";
      
      const speech = new SpeechSynthesisUtterance(reply);
      speech.rate = 1.0;
      window.speechSynthesis.speak(speech);

    } catch (err) {
      chatBox.innerHTML += `<div style="color: #f87171; margin: 8px 0;"><b>System:</b> Connection failed. Check network.</div>`;
      document.getElementById('status').innerText = "Tap orb to speak";
    }
  }
</script>

</body>
</html>
