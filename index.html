<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Pal by Raj</title>
  <style>
    body { background: #f0f8ff; font-family: 'Comic Sans MS', cursive, sans-serif; text-align: center; padding: 20px; }
    .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 400px; box-sizing: border-box; }
    input { padding: 12px; font-size: 16px; border-radius: 10px; border: 2px solid #ccc; margin: 10px 0; width: 90%; box-sizing: border-box; }
    button { padding: 14px; font-size: 18px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; width: 90%; margin: 10px 0; background: #ff7f50; color: white; }
    .link-btn { background: #4285F4; text-decoration: none; display: inline-block; color: white; border-radius: 10px; padding: 12px; font-weight: bold; width: 90%; box-sizing: border-box; margin-bottom: 10px; }
    
    /* Big Live Audio Orb Button */
    .mic-orb { width: 110px; height: 110px; background: #4CAF50; border-radius: 50%; margin: 20px auto; display: flex; align-items: center; justify-content: center; font-size: 45px; color: white; box-shadow: 0 0 0 rgba(76, 175, 80, 0.4); animation: pulse 2s infinite; cursor: pointer; border: none; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
      70% { box-shadow: 0 0 0 25px rgba(76, 175, 80, 0); }
      100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
    }

    #chat-box { height: 180px; border: 2px dashed #add8e6; border-radius: 10px; overflow-y: auto; margin-bottom: 10px; padding: 10px; text-align: left; background: #fffaf0; font-size: 14px; }
    .branding { font-size: 13px; color: #888; margin-top: 15px; }
    #status { font-weight: bold; color: #4CAF50; margin: 10px 0; font-size: 15px; }
  </style>
</head>
<body>

<div class="card">
  <h2>🌟 Language Pal 🌟</h2>
  <p style="font-size: 14px; color: #555; margin-top: -10px;">by Raj</p>
  
  <!-- Setup Screen -->
  <div id="setup-screen">
    <p style="font-size: 14px;">Enter your email and paste your free Google API key:</p>
    <input type="email" id="parentEmail" placeholder="Parent's Email">
    <a href="https://aistudio.google.com/app/apikey" target="_blank" class="link-btn">1. Get Free Key from Google</a>
    <input type="password" id="apiKeyInput" placeholder="Paste your API key here">
    <button onclick="saveKey()">2. Launch Voice App!</button>
  </div>

  <!-- Main Voice Screen -->
  <div id="app-screen" style="display:none;">
    <div id="chat-box"><div><b>Tutor Pingo:</b> Tap the green button and speak clearly! 🌍</div></div>
    <div id="status">Tap orb to speak</div>
    
    <!-- Tap-to-Talk Seamless Orb -->
    <button class="mic-orb" onclick="startListening()">🎤</button>
  </div>

  <div class="branding">Powered by Raj Thakkar</div>
</div>

<script>
  function saveKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    const email = document.getElementById('parentEmail').value.trim();
    
    if(!key) {
      alert("Please paste your API key first!");
      return;
    }

    localStorage.setItem('app_key', key);
    if(email) localStorage.setItem('parent_email', email);

    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
  }

  window.onload = function() {
    if(localStorage.getItem('app_key')) {
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
    }
  }

  function startListening() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Please use Google Chrome or Safari browser for voice features.");
      return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    document.getElementById('status').innerText = "Listening closely... Speak now! 🎙️";

    recognition.onresult = async function(event) {
      const speechText = event.results[0][0].transcript;
      document.getElementById('status').innerText = "Pingo is thinking...";
      await sendToGemini(speechText);
    };

    recognition.onerror = function(event) {
      document.getElementById('status').innerText = "Tap orb to try again";
    };

    recognition.onend = function() {
      if(document.getElementById('status').innerText.includes("Listening")) {
        document.getElementById('status').innerText = "Tap orb to speak";
      }
    };

    recognition.start();
  }

  async function sendToGemini(text) {
    const chatBox = document.getElementById('chat-box');
    chatBox.innerHTML += `<div><b>Child:</b> ${text}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    const apiKey = localStorage.getItem('app_key');
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

    const payload = {
      "contents": [{
        "parts": [{
          "text": "CRITICAL RULE: You are a warm, highly encouraging kids' language tutor mascot named Pingo. You ONLY teach languages (vocabulary, pronunciation, simple phrases). Keep sentences short and clear. If asked about anything else, politely redirect them back to learning languages. The child says: " + text
        }]
      }]
    };

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await response.json();
      const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Let's learn a fun new word!";
      
      chatBox.innerHTML += `<div><b>Tutor Pingo:</b> ${reply}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
      document.getElementById('status').innerText = "Tap orb to speak";
      
      // Clear audio speech response back out loud
      const speech = new SpeechSynthesisUtterance(reply);
      speech.rate = 0.95; 
      window.speechSynthesis.speak(speech);

    } catch (err) {
      chatBox.innerHTML += `<div><b>System:</b> Check your API key or internet connection.</div>`;
      document.getElementById('status').innerText = "Tap orb to speak";
    }
  }
</script>

</body>
</html>
