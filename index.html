<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Pal by Raj Thakkar</title>
  <style>
    body { background: #f0f8ff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; }
    .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 450px; box-sizing: border-box; }
    input { padding: 12px; font-size: 16px; border-radius: 10px; border: 2px solid #ccc; margin: 10px 0; width: 90%; box-sizing: border-box; }
    button { padding: 14px; font-size: 18px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; width: 90%; margin: 10px 0; background: #ff7f50; color: white; }
    .link-btn { background: #4285F4; text-decoration: none; display: inline-block; color: white; border-radius: 10px; padding: 12px; font-weight: bold; width: 90%; box-sizing: border-box; margin-bottom: 10px; }
    
    /* Gemini Live Pulsing Orb Style */
    .live-orb { width: 110px; height: 110px; background: linear-gradient(135deg, #4285F4, #9b59b6, #ff7f50); border-radius: 50%; margin: 20px auto; display: flex; align-items: center; justify-content: center; font-size: 45px; color: white; cursor: pointer; border: none; box-shadow: 0 0 20px rgba(66, 133, 244, 0.4); transition: transform 0.2s; }
    .live-orb.listening { animation: livePulse 1.5s infinite; background: #ea4335; }
    @keyframes livePulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 67, 53, 0.6); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 20px rgba(234, 67, 53, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 67, 53, 0); }
    }

    #chat-box { height: 220px; border: 2px dashed #add8e6; border-radius: 10px; overflow-y: auto; margin-bottom: 10px; padding: 10px; text-align: left; background: #fffaf0; font-size: 14px; }
    .branding { font-size: 18px; font-weight: bold; color: #2c3e50; margin-top: 20px; letter-spacing: 0.5px; border-top: 2px solid #eee; padding-top: 12px; }
    #status { font-weight: bold; color: #4285F4; margin: 10px 0; font-size: 15px; }
  </style>
</head>
<body>

<div class="card">
  <h2>🌍 Language Pal Live 🌍</h2>
  
  <div id="setup-screen">
    <p style="font-size: 14px;">Enter your email and paste your free Google API key:</p>
    <input type="email" id="parentEmail" placeholder="Your Email">
    <a href="https://aistudio.google.com/app/apikey" target="_blank" class="link-btn">1. Get Free Key from Google</a>
    <input type="password" id="apiKeyInput" placeholder="Paste your API key here">
    <button onclick="saveKey()">2. Launch Live Session!</button>
  </div>

  <div id="app-screen" style="display:none;">
    <div id="chat-box"><div><b>Tutor:</b> Tap the glowing orb to start speaking seamlessly!</div></div>
    <div id="status">Tap orb to speak</div>
    <button id="orbBtn" class="live-orb" onclick="toggleListening()">🎙️</button>
  </div>

  <div class="branding">Created by Raj Thakkar</div>
</div>

<script>
  const SCRIPT_URL = "YOUR_NEW_APPS_SCRIPT_WEB_APP_URL_HERE"; // Put your actual deployment script URL here
  let recognition;
  let isListening = false;

  function saveKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    const email = document.getElementById('parentEmail').value.trim();
    
    if(!key) {
      alert("Please paste your API key first!");
      return;
    }

    localStorage.setItem('app_key', key);
    if(email) localStorage.setItem('parent_email', email);

    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
  }

  window.onload = function() {
    if(localStorage.getItem('app_key')) {
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
    }
    initSpeechRecognition();
  }

  function initSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onresult = function(event) {
      const transcript = event.results[0][0].transcript;
      document.getElementById('status').innerText = "Hearing: " + transcript;
      if (event.results[0].isFinal) {
        sendToBackend(transcript);
      }
    };

    recognition.onerror = function() {
      stopOrb();
      document.getElementById('status').innerText = "Tap orb to speak";
    };

    recognition.onend = function() {
      stopOrb();
    };
  }

  function toggleListening() {
    if (!recognition) {
      alert("Speech recognition is not supported in this browser. Please use Google Chrome.");
      return;
    }

    if (isListening) {
      recognition.stop();
      stopOrb();
    } else {
      try {
        recognition.start();
        startOrb();
      } catch (e) {
        recognition.stop();
        stopOrb();
      }
    }
  }

  function startOrb() {
    isListening = true;
    const btn = document.getElementById('orbBtn');
    btn.classList.add('listening');
    document.getElementById('status').innerText = "Listening actively... Speak now!";
  }

  function stopOrb() {
    isListening = false;
    const btn = document.getElementById('orbBtn');
    btn.classList.remove('listening');
    if (!document.getElementById('status').innerText.includes("Thinking")) {
      document.getElementById('status').innerText = "Tap orb to speak";
    }
  }

  async function sendToBackend(text) {
    const chatBox = document.getElementById('chat-box');
    chatBox.innerHTML += `<div><b>You:</b> ${text}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
    document.getElementById('status').innerText = "AI is thinking...";

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          apiKey: localStorage.getItem('app_key'),
          email: localStorage.getItem('parent_email') || "Unknown",
          message: text
        })
      });

      const data = await response.json();
      
      let reply = "";
      if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
        reply = data.candidates[0].content.parts[0].text;
      } else if (data.error) {
        reply = "API Error: " + (data.error.message || JSON.stringify(data.error));
      } else {
        reply = JSON.stringify(data);
      }
      
      chatBox.innerHTML += `<div><b>Tutor:</b> ${reply}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
      document.getElementById('status').innerText = "Tap orb to speak";
      
      // Real-time voice synthesis response
      const speech = new SpeechSynthesisUtterance(reply);
      speech.rate = 1.0;
      window.speechSynthesis.speak(speech);

    } catch (err) {
      chatBox.innerHTML += `<div><b>System:</b> Connection failed. Check network.</div>`;
      document.getElementById('status').innerText = "Tap orb to speak";
    }
  }
</script>

</body>
</html>
